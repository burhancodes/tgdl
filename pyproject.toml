[project]
name = "tgdl-bot"
version = "0.4.306"
description = "An all-in-one Telegram media & file downloader, archive extractor, cloud storage mirror, and torrent manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "async-mega-py",
    "av>=18.0.0",
    "cyberdrop-dl-patched>=10.5.0",
    "filetype>=1.2.0",
    "feedparser>=6.0.11",
    "gallery-dl>=1.32.8",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "kurigram>=2.2.24",
    "patool>=4.0.5",
    "pedalboard>=0.9.24",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "py7zr>=1.1.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyunpack>=0.3",
    "tenacity>=9.1.4",
    "tgcrypto>=1.2.5",
    "webhost",
]

[tool.uv.sources]
async-mega-py = { git = "https://github.com/NTFSvolume/mega.py.git" }
webhost = { git = "https://github.com/Burhanverse/webhost.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

