name: Docker Build & Push to GHCR

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push GHCR Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Compose Images
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          LOWER_REPO=$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          export BOT_IMAGE="ghcr.io/${LOWER_REPO}/tgdl-bot:latest"
          export SCRAPER_IMAGE="ghcr.io/${LOWER_REPO}/magnetio-scraper:latest"

          echo "Building images: ${BOT_IMAGE} and ${SCRAPER_IMAGE}..."
          docker compose build --parallel

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Pushing images to GHCR..."
            docker compose push
          fi
