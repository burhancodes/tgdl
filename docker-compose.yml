services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  magnetio-scraper:
    image: ${SCRAPER_IMAGE:-ghcr.io/burhanverse/tgdl-bot/magnetio-scraper:latest}
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - RPC_SHARED_SECRET=${MAGNETIO_RPC_SECRET:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SCRAPER_PROVIDER_TIMEOUT_MS=${SCRAPER_PROVIDER_TIMEOUT_MS:-20000}
      - SCRAPER_HARD_TIMEOUT_MS=${SCRAPER_HARD_TIMEOUT_MS:-30000}
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  tgdl-bot:
    image: ${BOT_IMAGE:-ghcr.io/burhanverse/tgdl-bot/tgdl-bot:latest}
    build: .
    env_file: .env
    depends_on:
      magnetio-scraper:
        condition: service_started
    environment:
      - MAGNETIO_RPC_URL=http://magnetio-scraper:8080/rpc
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  redis-data:
