services:
  magnetio-scraper:
    image: ${SCRAPER_IMAGE:-ghcr.io/burhancodes/tgdl/magnetio-scraper:latest}
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=8080
      - RPC_SHARED_SECRET=${MAGNETIO_RPC_SECRET:-}
      - SCRAPER_PROVIDER_TIMEOUT_MS=${SCRAPER_PROVIDER_TIMEOUT_MS:-20000}
      - SCRAPER_HARD_TIMEOUT_MS=${SCRAPER_HARD_TIMEOUT_MS:-30000}
      - SCRAPER_PROXY_URL=${SCRAPER_PROXY_URL:-}
      - SCRAPER_PROXY_PROVIDERS=${SCRAPER_PROXY_PROVIDERS:-}
      - SCRAPER_DISABLED_PROVIDERS=${SCRAPER_DISABLED_PROVIDERS:-}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=384
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  tgdl:
    image: ${BOT_IMAGE:-ghcr.io/burhancodes/tgdl/tgdl-bot:latest}
    build: .
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${TGDL_MEM:-1g}
    memswap_limit: ${TGDL_MEM:-1g}
    cpus: ${TGDL_CPUS:-2}
    pids_limit: 1024
    oom_score_adj: 500
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      magnetio-scraper:
        condition: service_healthy
    env_file: .env
    environment:
      MAGNETIO_RPC_URL: http://magnetio-scraper:8080/rpc
      GOMEMLIMIT: ${GOMEMLIMIT:-800MiB}
      GOGC: "50"
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
      - ./logs:/app/logs
