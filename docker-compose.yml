# Tuning for host RAM:
# - Both tgdl and telegram-bot-api are configured with default limits of 3 GB RAM and 2 CPUs.
# - If your host has less RAM (e.g. 4-6 GB total), adjust BOTAPI_MEM (e.g. 1.5g-2g) and TGDL_MEM (e.g. 1.5g-2g) in your .env.
# - Note that the telegram-bot-api container may legitimately buffer hundreds of MBs during large multi-hundred-MB or GB uploads/downloads.
# - GOMEMLIMIT should be set to ~75-80% of TGDL_MEM (default: 2400MiB for 3g limit) so Go's GC aggressively avoids OOM.
# - oom_score_adj is set to 500 on tgdl so the kernel terminates tgdl before host-critical processes in severe host memory pressure.

services:
  # A self-hosted Bot API server lifts the cloud Bot API limits (50MB up /
  # 20MB down) to 2000MB. Get api id/hash from https://my.telegram.org.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    mem_limit: ${BOTAPI_MEM:-3g}
    memswap_limit: ${BOTAPI_MEM:-3g}
    cpus: ${BOTAPI_CPUS:-2}
    pids_limit: 512
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TELEGRAM_API_ID: ${TG_API_ID}
      TELEGRAM_API_HASH: ${TG_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - botapi-data:/var/lib/telegram-bot-api
      - ./data:/app/data:ro

  magnetio-scraper:
    image: ${SCRAPER_IMAGE:-ghcr.io/burhancodes/tgdl/magnetio-scraper:latest}
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=8080
      - RPC_SHARED_SECRET=${MAGNETIO_RPC_SECRET:-}
      - SCRAPER_PROVIDER_TIMEOUT_MS=${SCRAPER_PROVIDER_TIMEOUT_MS:-20000}
      - SCRAPER_HARD_TIMEOUT_MS=${SCRAPER_HARD_TIMEOUT_MS:-30000}
      - NODE_OPTIONS=--max-old-space-size=384
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  tgdl:
    image: ${BOT_IMAGE:-ghcr.io/burhancodes/tgdl/tgdl-bot:latest}
    build: .
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    mem_limit: ${TGDL_MEM:-3g}
    memswap_limit: ${TGDL_MEM:-3g}
    cpus: ${TGDL_CPUS:-2}
    pids_limit: 1024
    oom_score_adj: 500
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      telegram-bot-api:
        condition: service_started
      magnetio-scraper:
        condition: service_healthy
    env_file: .env
    environment:
      TG_BOT_API_URL: http://telegram-bot-api:8081
      TG_BOT_API_LOCAL_DIR_MAP: /app/data=/app/data
      MAGNETIO_RPC_URL: http://magnetio-scraper:8080/rpc
      GOMEMLIMIT: ${GOMEMLIMIT:-2400MiB}
      GOGC: "50"
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
      - ./logs:/app/logs
      # Lets the bot read and clean up files the local Bot API server saved.
      - botapi-data:/var/lib/telegram-bot-api:rw

volumes:
  botapi-data:
