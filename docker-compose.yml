services:
  # A self-hosted Bot API server lifts the cloud Bot API limits (50MB up /
  # 20MB down) to 2000MB. Get api id/hash from https://my.telegram.org.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TG_API_ID}
      TELEGRAM_API_HASH: ${TG_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - botapi-data:/var/lib/telegram-bot-api

  tgdl:
    image: ${BOT_IMAGE:-ghcr.io/burhanverse/tgdl:latest}
    build: .
    restart: unless-stopped
    depends_on: [telegram-bot-api]
    env_file: .env
    environment:
      TG_BOT_API_URL: http://telegram-bot-api:8081
    volumes:
      - ./data:/app/data
      - ./auth:/app/auth
      - ./logs:/app/logs
      # Lets the bot read files the local Bot API server saved for getFile.
      - botapi-data:/var/lib/telegram-bot-api:ro

volumes:
  botapi-data:
